# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Production 3D catalog. Override with -PbiologyCatalogUrl=... for local testing.
biologyCatalogUrl=https://indianservers.com/edutech/biology/3d/biology-catalog.json

# Infographic metadata is cached in SQLite; full images download only when saved.
# biologyInfographicCatalogUrl=https://cdn.example.com/biology/infographics/catalog.json

# Tissue slide metadata is cached in SQLite; image tiles stream only when viewed.
biologyMicroscopyCatalogUrl=https://indianservers.com/edutech/biology/microscopy/catalog.json

# Separate anatomy-system catalogue; models download only when selected by the user.
biologyAnatomyCatalogUrl=https://indianservers.com/edutech/biology/3d/anatomy-catalog.json
