<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <script type="module" src="./model-viewer.min.js"></script>
    <style>
        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #031326;
            color: #f4faf7;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            touch-action: none;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 50% 42%, rgba(24, 94, 151, 0.52), transparent 42%),
                #031326;
            touch-action: none;
            --poster-color: transparent;
            --progress-bar-color: #55e7d0;
            --progress-mask: transparent;
        }

        .message {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 36px;
            text-align: center;
            color: #b9c8dc;
            font-size: 15px;
            line-height: 1.55;
            pointer-events: none;
        }

        .hotspot {
            width: 22px;
            height: 22px;
            padding: 0;
            border: 2px solid #fff;
            border-radius: 50%;
            background: #7c4dff;
            box-shadow: 0 0 0 6px rgba(124, 77, 255, 0.24), 0 0 18px #8d68ff;
        }

        .hotspot::after {
            content: attr(data-label);
            position: absolute;
            left: 18px;
            top: -13px;
            display: none;
            width: max-content;
            max-width: 170px;
            padding: 8px 11px;
            border: 1px solid #936cff;
            border-radius: 6px;
            background: rgba(12, 16, 44, 0.94);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            line-height: 1.2;
            pointer-events: none;
        }

        .hotspot.selected {
            background: #55e7d0;
            box-shadow: 0 0 0 6px rgba(85, 231, 208, 0.22), 0 0 20px #55e7d0;
        }

        .hotspot.selected::after { display: block; }
        .hotspot[hidden] { display: none; }
    </style>
</head>
<body>
<model-viewer
    id="viewer"
    camera-controls
    auto-rotate
    auto-rotate-delay="1800"
    rotation-per-second="18deg"
    interaction-prompt="auto"
    interaction-prompt-threshold="1200"
    disable-tap
    exposure="1"
    shadow-intensity="0.7"
    camera-orbit="0deg 72deg auto"
    min-camera-orbit="auto 5deg 12%"
    max-camera-orbit="auto 175deg 500%">
</model-viewer>
<div id="message" class="message">Loading 3D model...</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const src = params.get("src");
    const title = params.get("title") || "Biology model";
    const missing = params.get("missing") === "1";
    const modelIndex = Number(params.get("modelIndex") || "-1");
    const rotationSpeed = Number(params.get("rotationSpeed") || "18");
    const viewer = document.getElementById("viewer");
    const message = document.getElementById("message");
    let parts = [];
    let initialCameraRadius = 0;
    let lastCameraUpdate = 0;

    try {
        parts = JSON.parse(params.get("parts") || "[]");
    } catch (_) {
        parts = [];
    }

    if (src) {
        viewer.src = src;
        viewer.setAttribute("rotation-per-second", `${rotationSpeed}deg`);
    } else if (missing) {
        viewer.style.display = "none";
        message.innerHTML = `<strong>${escapeHtml(title)}</strong><br>This model is listed but has not been downloaded to this device yet.`;
    } else {
        message.textContent = "Select a model to begin.";
    }

    viewer.addEventListener("load", () => {
        addHotspots();
        initialCameraRadius = viewer.getCameraOrbit().radius;
        reportCameraState();
        captureThumbnail();
        message.style.display = "none";
    });

    viewer.addEventListener("camera-change", () => {
        const now = Date.now();
        if (now - lastCameraUpdate < 180) return;
        lastCameraUpdate = now;
        reportCameraState();
    });

    viewer.addEventListener("error", () => {
        viewer.style.display = "none";
        message.innerHTML = `<strong>${escapeHtml(title)}</strong><br>The 3D file could not be opened. Download it again and retry.`;
    });

    function addHotspots() {
        parts.forEach((part, index) => {
            const hotspot = document.createElement("button");
            hotspot.type = "button";
            hotspot.className = "hotspot";
            hotspot.slot = `hotspot-${index}`;
            hotspot.dataset.position = part.position;
            hotspot.dataset.normal = part.normal || "0 0 1";
            hotspot.dataset.label = part.title;
            hotspot.setAttribute("aria-label", `Identify ${part.title}`);
            hotspot.addEventListener("click", event => {
                event.stopPropagation();
                selectPart(index);
                if (window.BiologyBridge) {
                    window.BiologyBridge.onPartSelected(index);
                }
            });
            viewer.appendChild(hotspot);
        });

        if (parts.length) selectPart(0);
    }

    window.selectPart = function(index) {
        viewer.querySelectorAll(".hotspot").forEach((hotspot, itemIndex) => {
            hotspot.classList.toggle("selected", itemIndex === Number(index));
        });
    };

    window.setAutoRotation = function(enabled) {
        viewer.autoRotate = Boolean(enabled);
    };

    window.setRotationSpeed = function(degreesPerSecond) {
        viewer.setAttribute("rotation-per-second", `${Number(degreesPerSecond)}deg`);
    };

    window.rotateBy = function(degrees) {
        const orbit = viewer.getCameraOrbit();
        const nextTheta = orbit.theta + Number(degrees) * Math.PI / 180;
        viewer.cameraOrbit = `${nextTheta}rad ${orbit.phi}rad ${orbit.radius}m`;
        viewer.jumpCameraToGoal();
    };

    window.zoomBy = function(factor) {
        const orbit = viewer.getCameraOrbit();
        const nextRadius = Math.max(0.05, orbit.radius * Number(factor));
        viewer.cameraOrbit = `${orbit.theta}rad ${orbit.phi}rad ${nextRadius}m`;
        viewer.jumpCameraToGoal();
    };

    window.resetView = function() {
        viewer.cameraOrbit = "0deg 72deg auto";
        viewer.cameraTarget = "auto auto auto";
        viewer.fieldOfView = "auto";
        viewer.jumpCameraToGoal();
    };

    function reportCameraState() {
        if (!window.BiologyBridge) return;
        const orbit = viewer.getCameraOrbit();
        if (!initialCameraRadius) initialCameraRadius = orbit.radius;
        const zoom = Math.max(35, Math.min(300, Math.round(initialCameraRadius / orbit.radius * 100)));
        const degrees = ((orbit.theta * 180 / Math.PI) % 360 + 360) % 360;
        let orientation = "Front";
        if (degrees >= 45 && degrees < 135) orientation = "Right";
        else if (degrees >= 135 && degrees < 225) orientation = "Back";
        else if (degrees >= 225 && degrees < 315) orientation = "Left";
        window.BiologyBridge.onCameraState(zoom, orientation);
    }

    async function captureThumbnail() {
        if (!window.BiologyBridge || modelIndex < 0 || typeof viewer.toBlob !== "function") return;
        try {
            const blob = await viewer.toBlob({ idealAspect: true });
            const reader = new FileReader();
            reader.onloadend = () => {
                const encoded = String(reader.result || "").split(",")[1] || "";
                if (encoded) window.BiologyBridge.onThumbnailReady(modelIndex, encoded);
            };
            reader.readAsDataURL(blob);
        } catch (_) {
            // A text badge remains available if this WebView cannot capture WebGL.
        }
    }

    function escapeHtml(value) {
        const node = document.createElement("div");
        node.textContent = value;
        return node.innerHTML;
    }
</script>
</body>
</html>
