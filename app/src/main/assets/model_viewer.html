<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <script type="module" src="./model-viewer.min.js"></script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #101815;
            color: #f4faf7;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 40%, #21342b 0%, #101815 58%, #0a0f0d 100%);
            --poster-color: transparent;
            --progress-bar-color: #6fe0a5;
            --progress-mask: transparent;
        }

        .message {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            text-align: center;
            color: #dce8e2;
            pointer-events: none;
        }
    </style>
</head>
<body>
<model-viewer
    id="viewer"
    camera-controls
    auto-rotate
    ar
    interaction-prompt="auto"
    exposure="1"
    shadow-intensity="0.7"
    camera-orbit="0deg 72deg auto"
    min-camera-orbit="auto auto 12%"
    max-camera-orbit="auto auto 500%">
</model-viewer>
<div id="message" class="message">Loading model...</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const model = params.get("model");
    const viewer = document.getElementById("viewer");
    const message = document.getElementById("message");

    if (model) {
        viewer.src = `biology/3d/${model}`;
    } else {
        message.textContent = "Select a model to begin.";
    }

    viewer.addEventListener("load", () => {
        message.style.display = "none";
    });

    viewer.addEventListener("error", () => {
        message.style.display = "grid";
        message.textContent = "This model could not be loaded.";
    });
</script>
</body>
</html>
