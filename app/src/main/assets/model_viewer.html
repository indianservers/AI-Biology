<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <script type="module" src="./model-viewer.min.js"></script>
    <style>
        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #031326;
            color: #f4faf7;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            touch-action: none;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 50% 42%, rgba(24, 94, 151, 0.52), transparent 42%),
                #031326;
            touch-action: none;
            --poster-color: transparent;
            --progress-bar-color: #55e7d0;
            --progress-mask: transparent;
        }

        .message {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 36px;
            text-align: center;
            color: #b9c8dc;
            font-size: 15px;
            line-height: 1.55;
            pointer-events: none;
        }

        .hotspot {
            width: 22px;
            height: 22px;
            padding: 0;
            border: 2px solid rgba(255, 255, 255, 0.58);
            border-radius: 50%;
            background: rgba(124, 77, 255, 0.48);
            box-shadow: 0 0 0 6px rgba(124, 77, 255, 0.14);
            opacity: 1;
            transition: opacity 140ms ease, background 140ms ease, box-shadow 140ms ease;
        }

        .hotspot-label {
            position: absolute;
            left: 18px;
            top: calc(-13px + var(--label-shift, 0px));
            display: none;
            width: max-content;
            max-width: 170px;
            padding: 8px 11px;
            border: 1px solid #936cff;
            border-radius: 6px;
            background: rgba(12, 16, 44, 0.94);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            line-height: 1.2;
            pointer-events: none;
            transform: translateX(var(--label-x-shift, 0px));
            z-index: 2;
        }

        .hotspot.label-left .hotspot-label {
            right: 18px;
            left: auto;
        }

        .hotspot.selected {
            border-color: #fff;
            background: #55e7d0;
            box-shadow: 0 0 0 6px rgba(85, 231, 208, 0.22), 0 0 20px #55e7d0;
            opacity: 1;
        }

        .hotspot.selected .hotspot-label,
        body.show-all-labels:not(.identify-mode) .hotspot[data-visible] .hotspot-label {
            display: block;
        }

        .hotspot:not([data-visible]) {
            opacity: 0;
            pointer-events: none;
        }

        .hotspot[hidden] { display: none; }

        #leader-lines {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
            pointer-events: none;
        }

        #leader-lines line {
            stroke: #936cff;
            stroke-width: 1.5;
            vector-effect: non-scaling-stroke;
        }

        #leader-lines line.selected {
            stroke: #55e7d0;
            stroke-width: 2;
        }

        body.high-contrast,
        body.high-contrast model-viewer {
            background: #000;
        }

        body.high-contrast .hotspot {
            border-color: #fff;
            background: #ffdf00;
            box-shadow: 0 0 0 5px #000, 0 0 0 8px #fff;
        }

        body.high-contrast .hotspot-label {
            border: 2px solid #ffdf00;
            background: #000;
            color: #fff;
        }

        body.large-labels .hotspot-label {
            max-width: 220px;
            padding: 10px 13px;
            font-size: 17px;
        }

        body.reduced-motion .hotspot {
            transition: none;
        }
    </style>
</head>
<body>
<model-viewer
    id="viewer"
    camera-controls
    auto-rotate
    auto-rotate-delay="1800"
    rotation-per-second="18deg"
    interaction-prompt="auto"
    interaction-prompt-threshold="1200"
    interpolation-decay="80"
    disable-tap
    exposure="1"
    shadow-intensity="0.7"
    camera-orbit="0deg 72deg auto"
    min-camera-orbit="auto 5deg 12%"
    max-camera-orbit="auto 175deg 500%">
</model-viewer>
<svg id="leader-lines" aria-hidden="true"></svg>
<div id="message" class="message" role="status" aria-live="polite">Loading 3D model...</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const src = params.get("src");
    const title = params.get("title") || "Biology model";
    const missing = params.get("missing") === "1";
    const modelIndex = Number(params.get("modelIndex") || "-1");
    const rotationSpeed = Number(params.get("rotationSpeed") || "18");
    let identifyMode = params.get("identifyMode") !== "0";
    let showAllLabels = params.get("showAllLabels") === "1";
    let reducedMotion = params.get("reducedMotion") === "1";
    let highContrast = params.get("highContrast") === "1";
    let largerLabels = params.get("largerLabels") === "1";
    let screenReaderMode = params.get("screenReader") === "1";
    const viewer = document.getElementById("viewer");
    const leaderLines = document.getElementById("leader-lines");
    const message = document.getElementById("message");
    let parts = [];
    let initialCameraRadius = 0;
    let lastCameraUpdate = 0;
    let pointerStart = null;
    let lastTapAt = 0;
    let selectedPartIndex = -1;

    applyAccessibilityClasses();

    try {
        parts = JSON.parse(params.get("parts") || "[]");
    } catch (_) {
        parts = [];
    }

    if (src) {
        viewer.src = src;
        viewer.alt = `Interactive 3D model of ${title}`;
        viewer.setAttribute("rotation-per-second", `${rotationSpeed}deg`);
    } else if (missing) {
        viewer.style.display = "none";
        message.innerHTML = `<strong>${escapeHtml(title)}</strong><br>This model is listed but has not been downloaded to this device yet.`;
        notifyModelState("error", `${title} is not available on this device.`);
    } else {
        message.textContent = "Select a model to begin.";
    }

    viewer.addEventListener("load", () => {
        addHotspots();
        document.body.classList.toggle("show-all-labels", showAllLabels);
        document.body.classList.toggle("identify-mode", identifyMode);
        viewer.autoRotate = !reducedMotion && !screenReaderMode;
        initialCameraRadius = viewer.getCameraOrbit().radius;
        reportCameraState();
        captureThumbnail();
        message.style.display = "none";
        notifyModelState("loaded", "");
        requestAnimationFrame(() => {
            requestAnimationFrame(resolveSurfaceAnchors);
        });
    });

    viewer.addEventListener("camera-change", () => {
        const now = Date.now();
        if (now - lastCameraUpdate < 180) return;
        lastCameraUpdate = now;
        reportCameraState();
        layoutHotspotLabels();
    });

    viewer.addEventListener("error", () => {
        viewer.style.display = "none";
        message.innerHTML = `<strong>${escapeHtml(title)}</strong><br>The 3D file could not be opened. Download it again and retry.`;
        notifyModelState("error", `${title} could not be opened. Retry the model or choose another one.`);
    });

    function addHotspots() {
        parts.forEach((part, index) => {
            const hotspot = document.createElement("button");
            hotspot.type = "button";
            hotspot.className = "hotspot";
            hotspot.slot = `hotspot-${index}`;
            if (part.surface) {
                hotspot.dataset.surface = part.surface;
            } else {
                hotspot.dataset.position = part.position;
                hotspot.dataset.normal = part.normal || "0 0 1";
            }
            hotspot.dataset.label = part.title;
            hotspot.dataset.visibilityAttribute = "visible";
            hotspot.setAttribute("aria-label", `Identify ${part.title}`);
            const label = document.createElement("span");
            label.className = "hotspot-label";
            label.textContent = part.title;
            hotspot.appendChild(label);
            hotspot.addEventListener("click", event => {
                event.stopPropagation();
                focusPart(index);
                if (window.BiologyBridge) {
                    window.BiologyBridge.onPartSelected(index);
                }
            });
            hotspot.addEventListener("hotspot-visibility", layoutHotspotLabels);
            viewer.appendChild(hotspot);
        });

        if (parts.length && !identifyMode) applyPartSelection(0);
    }

    window.selectPart = applyPartSelection;

    function applyPartSelection(index) {
        selectedPartIndex = Number(index);
        viewer.querySelectorAll(".hotspot").forEach((hotspot, itemIndex) => {
            hotspot.classList.toggle("selected", itemIndex === selectedPartIndex);
        });
        layoutHotspotLabels();
    }

    async function resolveSurfaceAnchors() {
        if (typeof viewer.surfaceFromPoint !== "function") return;
        const hotspots = [...viewer.querySelectorAll(".hotspot")];
        let changed = false;

        for (const [index, hotspot] of hotspots.entries()) {
            let data = viewer.queryHotspot(hotspot.slot);
            if (
                hotspot.dataset.surface &&
                data &&
                Number.isFinite(data.canvasPosition.x) &&
                Number.isFinite(data.canvasPosition.y)
            ) {
                continue;
            }
            if (hotspot.dataset.surface) {
                delete hotspot.dataset.surface;
                hotspot.dataset.position = parts[index].position;
                hotspot.dataset.normal = parts[index].normal || "0 0 1";
                viewer.updateHotspot({
                    name: hotspot.slot,
                    position: hotspot.dataset.position,
                    normal: hotspot.dataset.normal
                });
                data = viewer.queryHotspot(hotspot.slot);
            }
            if (!data) continue;
            const surface = findSurfaceNear(
                data.canvasPosition.x,
                data.canvasPosition.y
            );
            if (!surface) continue;

            hotspot.dataset.surface = surface;
            viewer.updateHotspot({ name: hotspot.slot, surface });
            changed = true;
        }

        if (changed && window.BiologyBridge && modelIndex >= 0) {
            const anchors = hotspots.map(hotspot => hotspot.dataset.surface || "");
            window.BiologyBridge.onSurfaceAnchorsReady(modelIndex, JSON.stringify(anchors));
        }
        layoutHotspotLabels();
    }

    function findSurfaceNear(x, y) {
        const offsets = [
            [0, 0],
            [-12, 0], [12, 0], [0, -12], [0, 12],
            [-24, -24], [24, -24], [-24, 24], [24, 24],
            [-36, 0], [36, 0], [0, -36], [0, 36],
            [-52, -26], [52, -26], [-52, 26], [52, 26]
        ];
        for (const [offsetX, offsetY] of offsets) {
            const sampleX = Math.max(1, Math.min(viewer.clientWidth - 1, x + offsetX));
            const sampleY = Math.max(1, Math.min(viewer.clientHeight - 1, y + offsetY));
            const surface = viewer.surfaceFromPoint(sampleX, sampleY);
            if (surface) return surface;
        }
        return null;
    }

    window.focusPart = focusPart;

    function focusPart(index) {
        applyPartSelection(index);
        const hotspot = viewer.queryHotspot(`hotspot-${Number(index)}`);
        if (!hotspot) return;
        const orbit = viewer.getCameraOrbit();
        const theta = hotspot.facingCamera ? orbit.theta : orbit.theta + Math.PI;
        const phi = orbit.phi;
        viewer.cameraTarget = hotspot.position.toString();
        viewer.cameraOrbit =
            `${theta}rad ${phi}rad ${Math.max(0.05, orbit.radius * 0.78)}m`;
        if (reducedMotion) viewer.jumpCameraToGoal();
        viewer.autoRotate = false;
    }

    window.setShowAllLabels = function(enabled) {
        showAllLabels = Boolean(enabled);
        document.body.classList.toggle("show-all-labels", showAllLabels);
        layoutHotspotLabels();
    };

    window.setIdentifyMode = function(enabled) {
        identifyMode = Boolean(enabled);
        document.body.classList.toggle("identify-mode", identifyMode);
        if (identifyMode) {
            selectedPartIndex = -1;
            viewer.querySelectorAll(".hotspot").forEach(hotspot => hotspot.classList.remove("selected"));
        }
        layoutHotspotLabels();
    };

    window.refreshHotspots = function() {
        viewer.querySelectorAll(".hotspot").forEach(hotspot => {
            const update = { name: hotspot.slot };
            if (hotspot.dataset.surface) {
                update.surface = hotspot.dataset.surface;
            } else {
                update.position = hotspot.dataset.position;
                update.normal = hotspot.dataset.normal;
            }
            viewer.updateHotspot(update);
        });
        requestAnimationFrame(() => {
            requestAnimationFrame(layoutHotspotLabels);
        });
    };

    window.setAutoRotation = function(enabled) {
        viewer.autoRotate = Boolean(enabled) && !reducedMotion && !screenReaderMode;
    };

    window.setAccessibility = function(
        useReducedMotion,
        useHighContrast,
        useLargerLabels,
        useScreenReader
    ) {
        reducedMotion = Boolean(useReducedMotion);
        highContrast = Boolean(useHighContrast);
        largerLabels = Boolean(useLargerLabels);
        screenReaderMode = Boolean(useScreenReader);
        applyAccessibilityClasses();
        if (reducedMotion || screenReaderMode) viewer.autoRotate = false;
        layoutHotspotLabels();
    };

    function applyAccessibilityClasses() {
        document.body.classList.toggle("reduced-motion", reducedMotion);
        document.body.classList.toggle("high-contrast", highContrast);
        document.body.classList.toggle("large-labels", largerLabels);
        document.body.classList.toggle("screen-reader-mode", screenReaderMode);
        viewer.interpolationDecay = reducedMotion ? 0 : 80;
    }

    window.setRotationSpeed = function(degreesPerSecond) {
        viewer.setAttribute("rotation-per-second", `${Number(degreesPerSecond)}deg`);
    };

    window.setCameraPreset = function(preset) {
        const radius = viewer.getCameraOrbit().radius;
        const cameraViews = {
            front: `0deg 72deg ${radius}m`,
            right: `90deg 72deg ${radius}m`,
            back: `180deg 72deg ${radius}m`,
            top: `0deg 12deg ${radius}m`
        };
        viewer.cameraTarget = "auto auto auto";
        viewer.cameraOrbit = cameraViews[preset] || cameraViews.front;
        viewer.jumpCameraToGoal();
    };

    window.rotateBy = function(degrees) {
        const orbit = viewer.getCameraOrbit();
        const nextTheta = orbit.theta + Number(degrees) * Math.PI / 180;
        viewer.cameraOrbit = `${nextTheta}rad ${orbit.phi}rad ${orbit.radius}m`;
        viewer.jumpCameraToGoal();
    };

    window.zoomBy = function(factor) {
        const orbit = viewer.getCameraOrbit();
        const nextRadius = Math.max(0.05, orbit.radius * Number(factor));
        viewer.cameraOrbit = `${orbit.theta}rad ${orbit.phi}rad ${nextRadius}m`;
        viewer.jumpCameraToGoal();
    };

    window.resetView = function() {
        viewer.cameraOrbit = "0deg 72deg auto";
        viewer.cameraTarget = "auto auto auto";
        viewer.fieldOfView = "auto";
        viewer.jumpCameraToGoal();
    };

    function reportCameraState() {
        if (!window.BiologyBridge) return;
        const orbit = viewer.getCameraOrbit();
        if (!initialCameraRadius) initialCameraRadius = orbit.radius;
        const zoom = Math.max(35, Math.min(300, Math.round(initialCameraRadius / orbit.radius * 100)));
        const degrees = ((orbit.theta * 180 / Math.PI) % 360 + 360) % 360;
        let orientation = "Front";
        if (degrees >= 45 && degrees < 135) orientation = "Right";
        else if (degrees >= 135 && degrees < 225) orientation = "Back";
        else if (degrees >= 225 && degrees < 315) orientation = "Left";
        window.BiologyBridge.onCameraState(zoom, orientation);
    }

    function layoutHotspotLabels() {
        const labeledHotspots = [...viewer.querySelectorAll(".hotspot[data-visible]")]
            .filter(hotspot =>
                hotspot.classList.contains("selected") ||
                (showAllLabels && !identifyMode)
            );
        viewer.querySelectorAll(".hotspot").forEach(hotspot => {
            hotspot.style.removeProperty("--label-shift");
            hotspot.style.removeProperty("--label-x-shift");
        });

        const positioned = labeledHotspots.map(hotspot => {
            const data = viewer.queryHotspot(hotspot.slot);
            const label = hotspot.querySelector(".hotspot-label");
            if (!data || !data.facingCamera || !label) return null;
            return {
                hotspot,
                label,
                x: data.canvasPosition.x,
                y: data.canvasPosition.y
            };
        }).filter(Boolean);

        positioned.forEach(item => {
            item.hotspot.classList.toggle("label-left", item.x > viewer.clientWidth * 0.5);
        });

        resolveLabelCollisions(positioned);
        clampLabelsHorizontally(positioned);
        requestAnimationFrame(() => drawLeaderLines(positioned));
    }

    function clampLabelsHorizontally(items) {
        const viewerBounds = viewer.getBoundingClientRect();
        const safeLeft = viewerBounds.left + 8;
        const safeRight = viewerBounds.right - 76;
        items.forEach(item => {
            const bounds = item.label.getBoundingClientRect();
            let shift = 0;
            if (bounds.left < safeLeft) {
                shift = safeLeft - bounds.left;
            } else if (bounds.right > safeRight) {
                shift = safeRight - bounds.right;
            }
            item.hotspot.style.setProperty("--label-x-shift", `${shift}px`);
        });
    }

    function resolveLabelCollisions(items) {
        const gap = 8;
        const edge = 8;
        const ordered = items.sort((a, b) => a.y - b.y);
        let previousBottom = edge;

        ordered.forEach(item => {
            const height = Math.max(32, item.label.getBoundingClientRect().height);
            const naturalTop = item.y - height / 2;
            const top = Math.max(edge, naturalTop, previousBottom + gap);
            item.labelTop = top;
            item.labelHeight = height;
            previousBottom = top + height;
        });

        let nextTop = viewer.clientHeight - edge;
        [...ordered].reverse().forEach(item => {
            const maximumTop = nextTop - item.labelHeight - gap;
            item.labelTop = Math.min(item.labelTop, maximumTop);
            item.labelTop = Math.max(edge, item.labelTop);
            nextTop = item.labelTop;
        });

        ordered.forEach(item => {
            const naturalTop = item.y - 13;
            item.hotspot.style.setProperty(
                "--label-shift",
                `${item.labelTop - naturalTop}px`
            );
        });
    }

    function drawLeaderLines(items) {
        leaderLines.replaceChildren();
        const viewerBounds = viewer.getBoundingClientRect();
        items.forEach(item => {
            if (!item.hotspot.matches("[data-visible]")) return;
            const labelBounds = item.label.getBoundingClientRect();
            if (!labelBounds.width || !labelBounds.height) return;

            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            const labelOnLeft = item.hotspot.classList.contains("label-left");
            line.setAttribute("x1", item.x);
            line.setAttribute("y1", item.y);
            line.setAttribute(
                "x2",
                (labelOnLeft ? labelBounds.right : labelBounds.left) - viewerBounds.left
            );
            line.setAttribute(
                "y2",
                labelBounds.top - viewerBounds.top + labelBounds.height / 2
            );
            if (item.hotspot.classList.contains("selected")) {
                line.classList.add("selected");
            }
            leaderLines.appendChild(line);
        });
    }

    window.addEventListener("resize", layoutHotspotLabels);

    viewer.addEventListener("pointerdown", event => {
        pointerStart = { x: event.clientX, y: event.clientY, at: Date.now() };
    });

    viewer.addEventListener("pointerup", event => {
        if (!pointerStart) return;
        const movement = Math.hypot(event.clientX - pointerStart.x, event.clientY - pointerStart.y);
        pointerStart = null;
        if (movement > 12) return;

        const now = Date.now();
        if (now - lastTapAt < 330) {
            focusFromPoint(event.clientX, event.clientY);
            lastTapAt = 0;
        } else {
            lastTapAt = now;
            if (window.BiologyBridge) window.BiologyBridge.onViewerTapped();
        }
    });

    function focusFromPoint(x, y) {
        const hit = viewer.positionAndNormalFromPoint(x, y);
        if (!hit) return;
        const orbit = viewer.getCameraOrbit();
        viewer.cameraTarget = `${hit.position.x}m ${hit.position.y}m ${hit.position.z}m`;
        viewer.cameraOrbit = `${orbit.theta}rad ${orbit.phi}rad ${Math.max(0.05, orbit.radius * 0.72)}m`;
        viewer.jumpCameraToGoal();
    }

    function notifyModelState(state, detail) {
        if (window.BiologyBridge) {
            window.BiologyBridge.onModelState(state, detail || "");
        }
    }

    async function captureThumbnail() {
        if (!window.BiologyBridge || modelIndex < 0 || typeof viewer.toBlob !== "function") return;
        try {
            const blob = await viewer.toBlob({ idealAspect: true });
            const reader = new FileReader();
            reader.onloadend = () => {
                const encoded = String(reader.result || "").split(",")[1] || "";
                if (encoded) window.BiologyBridge.onThumbnailReady(modelIndex, encoded);
            };
            reader.readAsDataURL(blob);
        } catch (_) {
            // A text badge remains available if this WebView cannot capture WebGL.
        }
    }

    function escapeHtml(value) {
        const node = document.createElement("div");
        node.textContent = value;
        return node.innerHTML;
    }
</script>
</body>
</html>
