<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <style>
    html, body, #viewer { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #020b18; }
    .label {
      transform: translate(-50%, -50%);
      padding: 5px 9px;
      border: 1px solid #9b6cff;
      border-radius: 5px;
      background: rgba(9, 15, 36, .9);
      color: #fff;
      font: 600 12px system-ui, sans-serif;
      white-space: nowrap;
      box-shadow: 0 0 14px rgba(132, 76, 255, .45);
      pointer-events: none;
    }
    .label::before {
      content: "";
      position: absolute;
      width: 8px;
      height: 8px;
      left: calc(50% - 4px);
      top: calc(50% - 4px);
      border-radius: 50%;
      background: #6ef0ca;
      box-shadow: 0 0 10px #6ef0ca;
    }
    .label span { margin-left: 8px; }
  </style>
</head>
<body>
<div id="viewer"></div>
<script src="openseadragon.min.js"></script>
<script>
  let viewer;
  let annotations = [];
  let labelsVisible = true;
  let imageWidth = 1;
  let imageHeight = 1;

  function notify(name, ...args) {
    if (window.MicroscopyBridge && window.MicroscopyBridge[name]) {
      window.MicroscopyBridge[name](...args);
    }
  }

  function initialize() {
    viewer = OpenSeadragon({
      id: "viewer",
      showNavigationControl: false,
      showNavigator: false,
      animationTime: 0.45,
      blendTime: 0.15,
      constrainDuringPan: true,
      visibilityRatio: 0.2,
      minZoomImageRatio: 0.7,
      maxZoomPixelRatio: 8,
      gestureSettingsMouse: { clickToZoom: false, dblClickToZoom: true },
      gestureSettingsTouch: { clickToZoom: false, dblClickToZoom: true, pinchToZoom: true }
    });
    viewer.addHandler("open", () => {
      const item = viewer.world.getItemAt(0);
      const size = item.getContentSize();
      imageWidth = size.x || imageWidth;
      imageHeight = size.y || imageHeight;
      renderLabels();
      notify("onReady");
    });
    viewer.addHandler("open-failed", event => {
      notify("onError", String(event.message || "Slide image could not be loaded."));
    });
    viewer.addHandler("zoom", event => notify("onZoomChanged", event.zoom.toFixed(2)));
    viewer.addHandler("canvas-click", event => {
      if (!event.quick || viewer.world.getItemCount() === 0) return;
      const viewportPoint = viewer.viewport.pointFromPixel(event.position);
      const imagePoint = viewer.world.getItemAt(0).viewportToImageCoordinates(viewportPoint);
      notify(
        "onSlideTap",
        Math.max(0, Math.min(1, imagePoint.x / imageWidth)),
        Math.max(0, Math.min(1, imagePoint.y / imageHeight))
      );
    });
    notify("onViewerInitialized");
  }

  function openSlide(type, url, width, height, annotationJson) {
    annotations = JSON.parse(annotationJson || "[]");
    imageWidth = Number(width) || 1;
    imageHeight = Number(height) || 1;
    viewer.clearOverlays();
    let tileSource = url;
    if (String(type).toLowerCase() === "image") {
      tileSource = {
        type: "image",
        url: url,
        buildPyramid: true,
        crossOriginPolicy: false
      };
    }
    viewer.open(tileSource);
  }

  function renderLabels() {
    viewer.clearOverlays();
    if (!labelsVisible || viewer.world.getItemCount() === 0) return;
    const item = viewer.world.getItemAt(0);
    annotations.forEach(annotation => {
      const element = document.createElement("div");
      element.className = "label";
      const text = document.createElement("span");
      text.textContent = annotation.label;
      element.appendChild(text);
      const imagePoint = new OpenSeadragon.Point(
        annotation.x * imageWidth,
        annotation.y * imageHeight
      );
      viewer.addOverlay({
        element: element,
        location: item.imageToViewportCoordinates(imagePoint),
        placement: OpenSeadragon.Placement.CENTER
      });
    });
  }

  function setLabelsVisible(visible) {
    labelsVisible = Boolean(visible);
    renderLabels();
  }

  function zoomBy(factor) {
    viewer.viewport.zoomBy(Number(factor));
    viewer.viewport.applyConstraints();
  }

  function resetView() {
    viewer.viewport.goHome(false);
  }

  function panBy(x, y) {
    const bounds = viewer.viewport.getBounds();
    viewer.viewport.panBy(new OpenSeadragon.Point(bounds.width * x, bounds.height * y));
    viewer.viewport.applyConstraints();
  }

  initialize();
</script>
</body>
</html>
